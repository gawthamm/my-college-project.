{% extends "base.html" %}

{% block title %}Page Not Found - Campus Smart Lost & Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="p-5 bg-white rounded-4 shadow-sm border max-w-md mx-auto" style="max-width: 500px;">
        <div class="mb-3 text-warning">
            <i class="bi bi-compass fs-1"></i>
        </div>
        <h2 class="fw-bold">404 - Page Not Found</h2>
        <p class="text-muted small mb-4">The item or page you are looking for might have been moved, removed, or is temporarily unavailable.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-house-door me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
