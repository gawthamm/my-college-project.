{% extends "base.html" %}

{% block title %}Log In - Campus Smart Lost & Found{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom border-0 shadow-lg p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="navbar-brand-badge mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
                        <i class="bi bi-person-lock"></i>
                    </span>
                    <h3 class="fw-bold text-dark mt-2">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your campus account to manage items and claims</p>
                </div>

                <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
                    <div class="mb-3">
                        <label for="loginIdentifier" class="form-label fw-semibold small text-secondary">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="loginIdentifier" name="identifier" placeholder="Enter username or email" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="loginPassword" class="form-label fw-semibold small text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="loginPassword" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember" value="1">
                            <label class="form-check-label small text-muted" for="remember">Remember me</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <div class="text-center pt-3 border-top">
                    <p class="small text-muted mb-0">
                        Don't have a campus account? 
                        <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
